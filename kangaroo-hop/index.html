<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kangaroo Hop! 🦘</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #7ec8e3;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ================= Kangaroo Hop! — an outback runner for Amalia's Arcade =================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, groundY = 0;

const STATE = { TITLE: 0, PLAYING: 1, OVER: 2 };
let state = STATE.TITLE;

// ---------- sound effects (Web Audio, no files) ----------
const sfx = (() => {
  let ac = null;
  function ensure() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, delay, dur, type, vol, slideTo) {
    const a = ensure(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    unlock() { ensure(); },
    jump() { tone(280, 0, 0.14, "square", 0.07, 720); },
    ping() { tone(880, 0, 0.10, "sine", 0.14); tone(1318, 0.09, 0.16, "sine", 0.14); },
    die()  { tone(300, 0, 0.35, "sawtooth", 0.11, 90); },
    start(){ tone(523, 0, 0.10, "triangle", 0.13); tone(784, 0.08, 0.14, "triangle", 0.13); }
  };
})();

// ---------- persistent best ----------
const BEST_KEY = "kangarooHop.best.v1";
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

// ---------- game state ----------
const GRAV = 2900, JUMP_V = 1020;
const roo = { x: 84, y: 0, vy: 0, grounded: true, runPhase: 0, dead: false };
let speed = 0, elapsed = 0, score = 0, prevScoreInt = 0, scorePop = 0;
let obstacles = [];   // {x, w, h, kind}
let spawnIn = 0;
let clouds = [], trees = [], pebbles = [];
let particles = [];   // dust {x,y,vx,vy,life,maxLife,size}
let shake = 0, newBest = false;
let backBtn = null;

const OB_KINDS = [
  { w: 30, h: 34, kind: "rock" },
  { w: 36, h: 58, kind: "rockTall" },
  { w: 48, h: 30, kind: "bush" },
  { w: 60, h: 26, kind: "log" },
  { w: 68, h: 42, kind: "rocks" },
];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = H - 130;
  initScenery();
}
function initScenery() {
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * H * 0.35, s: 0.6 + Math.random() * 0.9 });
  trees = [];
  for (let i = 0; i < 4; i++) trees.push({ x: Math.random() * (W + 400), s: 0.7 + Math.random() * 0.6 });
  pebbles = [];
  for (let i = 0; i < 26; i++) pebbles.push({ x: Math.random() * W, dx: Math.random() * 8, r: 2 + Math.random() * 3.5 });
}
window.addEventListener("resize", resize);

// ---------- flow ----------
function startGame() {
  state = STATE.PLAYING;
  elapsed = 0; score = 0; prevScoreInt = 0; scorePop = 0; newBest = false;
  obstacles = []; particles = []; shake = 0;
  spawnIn = 500;
  roo.y = groundY; roo.vy = 0; roo.grounded = true; roo.dead = false; roo.runPhase = 0;
  sfx.start();
}
function endGame() {
  state = STATE.OVER;
  roo.dead = true;
  shake = 12;
  sfx.die();
  burst(roo.x, roo.y - 30, 10);
  const s = Math.floor(score);
  if (s > best) { best = s; newBest = s > 0; saveBest(); }
}
function hop() {
  if (state !== STATE.PLAYING || !roo.grounded) return;
  roo.grounded = false; roo.vy = -JUMP_V;
  sfx.jump();
  dust(roo.x - 14, groundY, 6);
}
function cutJump() { if (state === STATE.PLAYING && !roo.grounded && roo.vy < -380) roo.vy = -380; }

// ---------- input ----------
window.addEventListener("keydown", e => {
  sfx.unlock();
  if (["ArrowUp", " "].includes(e.key)) e.preventDefault();
  if (state !== STATE.PLAYING && (e.key === " " || e.key === "ArrowUp" || e.key === "Enter")) { startGame(); return; }
  if ((e.key === " " || e.key === "ArrowUp") && !e.repeat) hop();
});
window.addEventListener("keyup", e => {
  if (e.key === " " || e.key === "ArrowUp") cutJump();
});
canvas.addEventListener("pointerdown", e => {
  sfx.unlock();
  if (hitBackButton(e)) { window.location.href = "../"; return; }
  if (state !== STATE.PLAYING) { startGame(); return; }
  hop();
});
canvas.addEventListener("pointerup", cutJump);
canvas.addEventListener("pointercancel", cutJump);

// ---------- particles ----------
function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: x + (Math.random() - 0.5) * 20, y: y - Math.random() * 6,
      vx: -60 - Math.random() * 120, vy: -30 - Math.random() * 90,
      life: 0.4 + Math.random() * 0.3, maxLife: 0.7, size: 2 + Math.random() * 3.5, color: "#d9a066" });
  }
}
function burst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 200;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 0.5 + Math.random() * 0.3, maxLife: 0.8, size: 2.5 + Math.random() * 3.5, color: "#8a5a28" });
  }
}

// ---------- update ----------
let lastT = 0;
function update(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1100 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (scorePop > 0) scorePop = Math.max(0, scorePop - dt);

  // clouds always drift a little, even on the title screen
  const drift = state === STATE.PLAYING ? speed : 12;
  for (const c of clouds) { c.x -= drift * 0.12 * dt; if (c.x < -140) { c.x = W + 120; c.y = 30 + Math.random() * H * 0.35; } }

  if (state !== STATE.PLAYING) return;
  elapsed += dt;
  speed = Math.min(330 + elapsed * 3.5, 750);   // gentle 2-minute ramp

  // roo physics
  roo.vy += GRAV * dt;
  roo.y += roo.vy * dt;
  if (roo.y >= groundY) {
    if (!roo.grounded && roo.vy > 500) dust(roo.x, groundY, 5);
    roo.y = groundY; roo.vy = 0; roo.grounded = true;
  }
  if (roo.grounded) roo.runPhase += dt * (7 + speed / 90);

  // scenery scroll
  for (const t of trees) { t.x -= speed * 0.45 * dt; if (t.x < -90) { t.x = W + 200 + Math.random() * 200; t.s = 0.7 + Math.random() * 0.6; } }
  for (const p of pebbles) { p.x -= speed * dt; if (p.x < -20) { p.x = W + 10; p.dx = Math.random() * 8; } }

  // spawn obstacles with fair gaps
  spawnIn -= speed * dt;
  if (spawnIn <= 0) {
    const k = OB_KINDS[(Math.random() * OB_KINDS.length) | 0];
    obstacles.push({ x: W + 60, w: k.w, h: k.h, kind: k.kind, seed: Math.random() * 10 });
    spawnIn = 300 + Math.random() * 360 + speed * 0.5;   // reaction window shrinks as speed climbs
  }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed * dt;
    if (o.x < -120) { obstacles.splice(i, 1); continue; }
    // collision (forgiving boxes)
    const rx0 = roo.x - 18, rx1 = roo.x + 20, ry0 = roo.y - 58, ry1 = roo.y - 4;
    const ox0 = o.x + 6, ox1 = o.x + o.w - 6, oy0 = groundY - o.h + 6, oy1 = groundY - 2;
    if (rx0 < ox1 && rx1 > ox0 && ry0 < oy1 && ry1 > oy0) { endGame(); return; }
  }

  // score
  const before = Math.floor(score);
  score += speed * dt * 0.025;
  const after = Math.floor(score);
  if (Math.floor(after / 100) > Math.floor(before / 100)) { sfx.ping(); scorePop = 0.6; }
}

// ---------- drawing ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, "#6ec6e8"); sky.addColorStop(0.7, "#bfe6ef"); sky.addColorStop(1, "#fde9c8");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, groundY + 2);
  // sun
  ctx.fillStyle = "rgba(255,236,170,0.85)";
  ctx.beginPath(); ctx.arc(W - 90, 90, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffe9a8";
  ctx.beginPath(); ctx.arc(W - 90, 90, 34, 0, Math.PI * 2); ctx.fill();
  // clouds
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  for (const c of clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 34 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x - 24 * c.s, c.y + 4 * c.s, 20 * c.s, 9 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 26 * c.s, c.y + 5 * c.s, 22 * c.s, 10 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // distant red hills
  ctx.fillStyle = "#c06a52";
  ctx.beginPath(); ctx.moveTo(0, groundY);
  const off = state === STATE.PLAYING ? (elapsed * speed * 0.18) % (W * 1.5) : 0;
  for (let x = -W * 1.5; x < W * 1.5; x += 30) {
    const hx = x - off + W * 0.75;
    const hy = groundY - 60 - Math.abs(Math.sin((x + 400) * 0.008)) * 90 - Math.abs(Math.sin(x * 0.02 + 2)) * 30;
    ctx.lineTo(hx, hy);
  }
  ctx.lineTo(W, groundY); ctx.closePath(); ctx.fill();
  // gum trees (mid parallax)
  for (const t of trees) drawTree(t.x, groundY, t.s);
  // ground
  ctx.fillStyle = "#cf7a3e"; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = "#a85a28"; ctx.fillRect(0, groundY, W, 6);
  ctx.fillStyle = "rgba(120,60,25,0.5)";
  for (const p of pebbles) {
    ctx.beginPath(); ctx.ellipse(p.x, groundY + 26 + p.dx * 6, p.r, p.r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  }
}
function drawTree(x, gy, s) {
  ctx.save(); ctx.translate(x, gy); ctx.scale(s, s);
  ctx.fillStyle = "#7a4a26";
  ctx.fillRect(-7, -78, 14, 78);
  ctx.fillStyle = "#5e8f4e";
  ctx.beginPath(); ctx.ellipse(0, -92, 34, 24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#6fa055";
  ctx.beginPath(); ctx.ellipse(-14, -100, 20, 15, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawRoo() {
  const b = "#c98a4b", bd = "#a06a35", belly = "#e8c08a";
  ctx.save();
  ctx.translate(roo.x, roo.y);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (roo.dead) ctx.rotate(0.1);
  const run = roo.grounded && state === STATE.PLAYING;
  const sw = run ? Math.sin(roo.runPhase) : 0;
  const tuck = roo.grounded ? 0 : 1;
  // shadow
  const airH = Math.min(1, (groundY - roo.y) / 220);
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath(); ctx.ellipse(0, 5, 30 * (1 - airH * 0.45), 7, 0, 0, Math.PI * 2); ctx.fill();
  // tail
  ctx.fillStyle = bd;
  ctx.beginPath();
  ctx.moveTo(-12, -22);
  ctx.quadraticCurveTo(-38, -20, -50, -6);
  ctx.quadraticCurveTo(-38, -4, -28, -12);
  ctx.quadraticCurveTo(-18, -18, -8, -22);
  ctx.closePath(); ctx.fill();
  // body + belly
  ctx.fillStyle = b;
  ctx.beginPath(); ctx.ellipse(-2, -36, 15, 21, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.ellipse(4, -32, 8, 13, -0.3, 0, Math.PI * 2); ctx.fill();
  // hind leg (big foot)
  const lift = tuck * 12 + Math.max(0, sw) * 5 * (1 - tuck);
  ctx.fillStyle = b;
  ctx.beginPath(); ctx.ellipse(-6, -24, 11, 13, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = bd;
  ctx.beginPath();
  ctx.moveTo(-12, -14 - lift);
  ctx.lineTo(14 + sw * 3 * (1 - tuck), -16 - lift);
  ctx.lineTo(26, -6 - lift * 0.4);
  ctx.lineTo(24, -2); ctx.lineTo(-10, -2);
  ctx.closePath(); ctx.fill();
  // forearm
  ctx.strokeStyle = bd; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(8, -38); ctx.lineTo(15, -26); ctx.stroke();
  // head + snout + nose
  ctx.fillStyle = b;
  ctx.beginPath(); ctx.arc(10, -60, 12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20, -57, 8, 6.5, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#8a5a28";
  ctx.beginPath(); ctx.arc(26, -59, 2.2, 0, Math.PI * 2); ctx.fill();
  // ears
  ctx.fillStyle = b;
  ctx.beginPath(); ctx.ellipse(3, -76, 4.5, 12, -0.18, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -75, 4.5, 11, 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#e8a0a0";
  ctx.beginPath(); ctx.ellipse(3, -76, 2, 7, -0.18, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -75, 2, 6.5, 0.14, 0, Math.PI * 2); ctx.fill();
  // eye (X when bonked)
  if (roo.dead) {
    ctx.strokeStyle = "#1c1c22"; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(9.5, -65.5); ctx.lineTo(16.5, -58.5);
    ctx.moveTo(16.5, -65.5); ctx.lineTo(9.5, -58.5);
    ctx.stroke();
  } else {
    ctx.fillStyle = "#1c1c22";
    ctx.beginPath(); ctx.arc(13, -62, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(14, -63, 1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawObstacle(o) {
  const y = groundY;
  ctx.save();
  ctx.translate(o.x, y);
  if (o.kind === "rock" || o.kind === "rockTall" || o.kind === "rocks") {
    ctx.fillStyle = "#8d8d99";
    const blobs = o.kind === "rocks" ? 2 : 1;
    for (let i = 0; i < blobs; i++) {
      const bx = i * (o.w - 22), bw = o.kind === "rocks" ? 30 : o.w, bh = o.h - i * 8;
      ctx.beginPath();
      ctx.moveTo(bx + 3, 0);
      ctx.lineTo(bx + 5, -bh + 8);
      ctx.quadraticCurveTo(bx + bw / 2, -bh - 4, bx + bw - 5, -bh + 10);
      ctx.lineTo(bx + bw - 3, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.beginPath();
      ctx.moveTo(bx + 8, -6);
      ctx.lineTo(bx + 10, -bh + 12);
      ctx.quadraticCurveTo(bx + bw / 2, -bh, bx + bw / 2 + 6, -bh + 12);
      ctx.lineTo(bx + 12, -6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#8d8d99";
    }
  } else if (o.kind === "bush") {
    ctx.fillStyle = "#4e9b47";
    const spikes = 5;
    for (let i = 0; i < spikes; i++) {
      const sx = (o.w / spikes) * i + 4, sh = o.h * (0.7 + 0.3 * Math.abs(Math.sin(o.seed + i * 2.1)));
      ctx.beginPath();
      ctx.moveTo(sx - 7, 0); ctx.lineTo(sx + 3, -sh); ctx.lineTo(sx + 12, 0);
      ctx.closePath(); ctx.fill();
    }
  } else if (o.kind === "log") {
    ctx.fillStyle = "#8a5a28";
    roundRect(0, -o.h, o.w, o.h, 10); ctx.fill();
    ctx.fillStyle = "#d9b380";
    ctx.beginPath(); ctx.ellipse(6, -o.h / 2, 5, o.h / 2 - 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8a5a28"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(6, -o.h / 2, 2.5, o.h / 4 - 2, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBackButton() {
  const w = 122, h = 38, x = 12, y = 12;
  backBtn = { x, y, w, h };
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  roundRect(x, y, w, h, 19); ctx.fill();
  ctx.fillStyle = "#5a3a22"; ctx.font = "700 17px -apple-system, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("‹ Arcade", x + w / 2, y + h / 2 + 1);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}
function hitBackButton(e) {
  if (!backBtn) return false;
  const x = e.clientX || 0, y = e.clientY || 0;
  return x >= backBtn.x && x <= backBtn.x + backBtn.w && y >= backBtn.y && y <= backBtn.y + backBtn.h;
}

function drawHUD() {
  ctx.textAlign = "right";
  const pop = 1 + scorePop * 0.8;
  ctx.fillStyle = "#5a3a22";
  ctx.font = "700 15px -apple-system, sans-serif";
  ctx.fillText("BEST " + best, W - 16, 22);
  ctx.save();
  ctx.translate(W - 16, 46); ctx.scale(pop, pop); ctx.translate(-(W - 16), -46);
  ctx.font = "800 30px -apple-system, sans-serif";
  ctx.fillText(String(Math.floor(score)).padStart(5, "0"), W - 16, 46);
  ctx.restore();
  ctx.textAlign = "left";
}

function drawPanel(title, lines, accent) {
  const w = Math.min(W - 60, 420), h = 120 + lines.length * 30;
  const x = W / 2 - w / 2, y = H / 2 - h / 2;
  ctx.fillStyle = "rgba(20,10,5,0.72)";
  roundRect(x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = accent; ctx.lineWidth = 4;
  roundRect(x, y, w, h, 22); ctx.stroke();
  ctx.textAlign = "center";
  ctx.fillStyle = accent; ctx.font = "900 40px -apple-system, sans-serif";
  ctx.fillText(title, W / 2, y + 62);
  ctx.fillStyle = "#ffffff"; ctx.font = "700 19px -apple-system, sans-serif";
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + 108 + i * 30));
  ctx.textAlign = "left";
}

function draw() {
  ctx.save();
  drawBackground();
  for (const o of obstacles) drawObstacle(o);
  drawRoo();
  drawParticles();
  drawBackButton();
  if (state === STATE.PLAYING) drawHUD();
  if (state === STATE.TITLE) {
    drawPanel("KANGAROO HOP!", [
      "Hop over the outback rocks!",
      "Tap, click, or press Space to jump.",
      best > 0 ? ("Best: " + best) : "How far can you hop?"
    ], "#ffb02e");
  } else if (state === STATE.OVER) {
    drawHUD();
    drawPanel("BONK!", [
      "Score: " + Math.floor(score) + (newBest ? "  —  NEW BEST!" : ""),
      "Best: " + best,
      "Tap or press Space to hop again"
    ], "#ff5e78");
  }
  ctx.restore();
}

// ---------- main loop ----------
function frame(now) {
  update(now);
  draw();
  requestAnimationFrame(frame);
}
resize();
roo.y = groundY;
requestAnimationFrame(frame);
</script>
</body>
</html>
