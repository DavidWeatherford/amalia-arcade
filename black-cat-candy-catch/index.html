<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Black Cat Candy Catch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0618;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
/* ================= Black Cat Candy Catch =================
   Move the black cat side to side. Catch falling candy: +1 point each.
   Miss 3 candies and the game is over. Top 5 scores persist via localStorage.
   Controls: Arrow keys / A,D  ·  mouse / touch drag.
================================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- persistent top scores ----------
const SCORE_KEY = "blackCatCandyCatch.topScores.v1";
function loadScores() {
  try {
    const raw = localStorage.getItem(SCORE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(n => typeof n === "number") : [];
  } catch (e) { return []; }
}
function saveScores(scores) {
  try { localStorage.setItem(SCORE_KEY, JSON.stringify(scores.slice(0, 5))); }
  catch (e) { /* storage unavailable; scores just won't persist */ }
}
let topScores = loadScores();

// ---------- game state ----------
const STATE = { TITLE: 0, PLAYING: 1, OVER: 2 };
let state = STATE.TITLE;
let score = 0, misses = 0, newBest = false;
let candies = [];          // {x, y, vy, kind, rot, vr, wob}
let spawnTimer = 0, elapsed = 0;
let stars = [], bats = [];
let shake = 0;
let particles = [];        // {x,y,vx,vy,life,maxLife,color,size}
let floaters = [];         // {x,y,t,text}
let missFlash = 0;
let backBtn = null;   // {x,y,w,h} of the ‹ Arcade button, set each frame by drawBackButton

const CAT_W = 96, CAT_SPEED = 520;
const CAT_LOOKS = [
  { body: "#0d0d12", hat: "#5b2d8e", hatDark: "#2c1240", buckle: "#ffb02e", label: "" },   // player 1
  { body: "#3d3d55", hat: "#ff5e78", hatDark: "#a02040", buckle: "#ffe66d", label: "P2" }, // player 2
];
let cats = [];   // cats[0] always exists; a 2nd joins on two-finger touch
function makeCat(x, look, grown) {
  return { x, tx: x, w: CAT_W, speed: CAT_SPEED, pulse: 0, spawnT: grown ? 1 : 0,
           body: look.body, hat: look.hat, hatDark: look.hatDark, buckle: look.buckle, label: look.label };
}
function resetCats() { cats = [makeCat(W / 2, CAT_LOOKS[0], true)]; }

// ---------- input ----------
const keys = {};
window.addEventListener("keydown", e => {
  sfx.unlock();
  keys[e.key] = true;
  if (["ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if (state !== STATE.PLAYING && (e.key === " " || e.key === "Enter")) startGame();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

const pointers = new Map();   // pointerId -> clientX; insertion order = player order
canvas.addEventListener("pointerdown", e => {
  sfx.unlock();
  if (hitBackButton(e)) { window.location.href = "../"; return; }
  pointers.set(e.pointerId, e.clientX);
  if (state !== STATE.PLAYING) { startGame(); return; }
  if (pointers.size >= 2 && cats.length === 1) joinSecondCat();
});
canvas.addEventListener("pointermove", e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e.clientX);
});
function releasePointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2 && cats.length === 2) leaveSecondCat();
}
window.addEventListener("pointerup", releasePointer);
window.addEventListener("pointercancel", releasePointer);
function clampX(x) { return Math.max(CAT_W/2, Math.min(W - CAT_W/2, x)); }

// second player joins with a pop when a 2nd finger touches down
function joinSecondCat() {
  const ids = [...pointers.keys()];
  const x = clampX(pointers.get(ids[1]));
  cats.push(makeCat(x, CAT_LOOKS[1], false));
  burst(x, H - 160, "pop");
  floaters.push({ x, y: H - 235, t: 0, text: "Player 2!", color: "#ff8fb3" });
  sfx.join();
}
function leaveSecondCat() {
  const c = cats.pop();
  splat(c.x, H - 110);   // little poof where it stood
}

// ---------- scenery ----------
function initScenery() {
  stars = [];
  const n = Math.floor((W * H) / 9000);
  for (let i = 0; i < n; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H*0.7,
                 r: Math.random()*1.6+0.4, tw: Math.random()*Math.PI*2,
                 ts: 1 + Math.random()*2 });
  }
  bats = [];
  for (let i = 0; i < 4; i++) {
    bats.push({ x: Math.random()*W, y: H*0.08 + Math.random()*H*0.25,
                vx: 30 + Math.random()*40, ph: Math.random()*Math.PI*2,
                s: 0.7 + Math.random()*0.7 });
  }
}
initScenery();
window.addEventListener("resize", initScenery);

// ---------- sound effects (Web Audio, no files needed) ----------
const sfx = (() => {
  let ac = null;
  function ensure() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* no audio */ }
    }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, delay, dur, type, vol, slideTo) {
    const a = ensure(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    unlock() { ensure(); },
    catch() { tone(660, 0, 0.12, "sine", 0.16); tone(990, 0.07, 0.16, "sine", 0.16); },
    miss()  { tone(220, 0, 0.28, "sawtooth", 0.10, 110); },
    over()  { tone(392, 0, 0.18, "triangle", 0.15); tone(311, 0.16, 0.18, "triangle", 0.15); tone(233, 0.32, 0.34, "triangle", 0.15); },
    start() { tone(523, 0, 0.10, "triangle", 0.13); tone(784, 0.08, 0.14, "triangle", 0.13); },
    join()  { tone(523, 0, 0.10, "triangle", 0.14); tone(659, 0.08, 0.10, "triangle", 0.14); tone(784, 0.16, 0.18, "triangle", 0.14); }
  };
})();

// ---------- catch / miss feedback ----------
const PARTICLE_COLORS = {
  corn: ["#ff8c1a", "#ffd23e", "#fff6e8"],
  wrapped: ["#9b30ff", "#c26bff", "#e0b3ff"],
  pop: ["#ff4d6d", "#ff8fa3", "#ffffff"]
};
function burst(x, y, kind) {
  const colors = PARTICLE_COLORS[kind] || ["#ffffff"];
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 90,
      life: 0.5 + Math.random()*0.3, maxLife: 0.8,
      color: colors[(Math.random()*colors.length)|0], size: 2 + Math.random()*3.5 });
  }
}
function splat(x, y) {
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI/2 + (Math.random()-0.5) * 2.4, sp = 40 + Math.random() * 130;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0.4 + Math.random()*0.25, maxLife: 0.65,
      color: "#8a8a99", size: 2 + Math.random()*3 });
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 0.8);
    ctx.fillStyle = f.color || "#ffd23e"; ctx.font = "800 22px -apple-system, sans-serif";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

// ---------- candy ----------
const CANDY_KINDS = ["corn", "wrapped", "pop"];
const MIN_LAND_GAP_START = 1.35, MIN_LAND_GAP_END = 0.9;   // fairness window shrinks as you survive
function landGap() { return MIN_LAND_GAP_START - Math.min(elapsed * 0.004, MIN_LAND_GAP_START - MIN_LAND_GAP_END); }
function nextVy() {
  const speedBase = 70 + Math.min(elapsed * 1.5, 180);   // gentle 2-minute ramp
  return speedBase * (0.75 + Math.random()*0.6);
}
function spawnCandy(vy) {
  const kind = CANDY_KINDS[(Math.random()*CANDY_KINDS.length)|0];
  const y0 = -30;
  candies.push({
    x: 20 + Math.random() * (W - 40),
    y: y0,
    vy,
    kind, rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*3,
    wob: Math.random()*Math.PI*2, wobAmp: 20 + Math.random()*25,
    wobFreq: 1.5 + Math.random()*1.5,
    landAt: elapsed + ((H - 120) - y0) / vy   // predicted catch-line arrival
  });
}
// Would a candy falling this fast land too close to another candy's landing?
function spawnIsFair(vy) {
  const t = elapsed + ((H - 120) - (-30)) / vy;
  const gap = landGap();
  for (const c of candies) {
    if (Math.abs(c.landAt - t) < gap) return false;
  }
  return true;
}

// ---------- flow ----------
function startGame() {
  state = STATE.PLAYING;
  score = 0; misses = 0; newBest = false;
  candies = []; spawnTimer = 0.4; elapsed = 0; shake = 0;
  particles = []; floaters = []; missFlash = 0;
  resetCats();
  sfx.start();
}
function endGame() {
  state = STATE.OVER;
  sfx.over();
  const prevBest = topScores.length ? topScores[0] : 0;
  if (score > prevBest && score > 0) newBest = true;
  topScores.push(score);
  topScores.sort((a,b) => b - a);
  topScores = topScores.slice(0, 5);
  saveScores(topScores);
}

// ---------- update ----------
let last = performance.now();
function update(now) {
  let dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  // bats always drift (ambient life on every screen)
  for (const b of bats) {
    b.x += b.vx * dt; b.ph += dt * 6;
    if (b.x > W + 40) { b.x = -40; b.y = H*0.08 + Math.random()*H*0.25; }
  }
  for (const s of stars) s.tw += dt * s.ts;

  // feedback animations run on every screen so they finish gracefully
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 46 * dt; f.t += dt;
    if (f.t > 0.8) floaters.splice(i, 1);
  }
  if (missFlash > 0) missFlash = Math.max(0, missFlash - dt * 1.6);
  for (const k of cats) {
    if (k.pulse > 0) k.pulse = Math.max(0, k.pulse - dt);
    if (k.spawnT < 1) k.spawnT = Math.min(1, k.spawnT + dt * 2.5);
  }

  if (state !== STATE.PLAYING) return;
  elapsed += dt;

  // cat movement: keys = velocity, pointer = glide to target
  // player 1: keyboard, else first touch. player 2 (if any): second touch.
  const px = [...pointers.values()];
  let kv = 0;
  if (keys["ArrowLeft"] || keys["a"] || keys["A"]) kv -= 1;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) kv += 1;
  const c0 = cats[0];
  if (kv !== 0) {
    c0.x = clampX(c0.x + kv * c0.speed * dt);
    c0.tx = c0.x;
  } else if (px.length > 0) {
    c0.tx = clampX(px[0]);
    const dx = c0.tx - c0.x;
    c0.x = clampX(c0.x + dx * Math.min(1, dt * 14));
  }
  if (cats.length > 1 && px.length > 1) {
    const c1 = cats[1];
    c1.tx = clampX(px[1]);
    const dx = c1.tx - c1.x;
    c1.x = clampX(c1.x + dx * Math.min(1, dt * 14));
  }

  // spawn: capped, and never schedule two landings on top of each other
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const vy = nextVy();
    if (candies.length < 5 && spawnIsFair(vy)) {
      spawnCandy(vy);
      spawnTimer = Math.max(0.4, 1.25 - elapsed * 0.007);   // gently busier over 2 minutes
    } else {
      spawnTimer = 0.2;   // try again shortly
    }
  }

  const catchY = H - 120;                 // vertical catch line (cat mouth height)
  const catchHalf = CAT_W * 0.68;
  for (let i = candies.length - 1; i >= 0; i--) {
    const c = candies[i];
    c.y += c.vy * dt;
    c.rot += c.vr * dt;
    c.wob += c.wobFreq * dt;
    const cx = c.x + Math.sin(c.wob) * c.wobAmp * 0.3;

    let caughtBy = null;
    if (c.y >= catchY - 14 && c.y <= catchY + 26) {
      for (const k of cats) if (Math.abs(cx - k.x) <= catchHalf) { caughtBy = k; break; }
    }
    if (caughtBy) {
      candies.splice(i, 1);
      score++;
      sfx.catch();
      caughtBy.pulse = 0.22;
      burst(cx, catchY, c.kind);
      floaters.push({ x: cx, y: catchY - 26, t: 0, text: "+1" });
      continue;
    }
    if (c.y > H + 30) {
      candies.splice(i, 1);
      misses++;
      shake = 10;
      missFlash = 0.4;
      sfx.miss();
      splat(cx, H - 16);
      if (misses >= 3) { endGame(); return; }
    }
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
}

// ---------- drawing ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#120826"); g.addColorStop(0.55, "#1d0f38"); g.addColorStop(1, "#2c1240");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // stars
  for (const s of stars) {
    const a = 0.35 + 0.65 * Math.abs(Math.sin(s.tw));
    ctx.globalAlpha = a; ctx.fillStyle = "#ffe9a8";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // moon
  const mx = W * 0.82, my = H * 0.16, mr = Math.min(W, H) * 0.075;
  const mg = ctx.createRadialGradient(mx, my, mr*0.2, mx, my, mr*2.2);
  mg.addColorStop(0, "rgba(255,240,200,0.35)"); mg.addColorStop(1, "rgba(255,240,200,0)");
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, mr*2.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#f7e8bd"; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(190,170,130,0.5)";
  ctx.beginPath(); ctx.arc(mx-mr*0.3, my-mr*0.2, mr*0.22, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.25, my+mr*0.3, mr*0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+mr*0.1, my-mr*0.45, mr*0.12, 0, Math.PI*2); ctx.fill();

  // bats
  ctx.strokeStyle = "#05030c"; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (const b of bats) {
    const w = 16 * b.s, flap = Math.sin(b.ph) * 6 * b.s;
    ctx.beginPath();
    ctx.moveTo(b.x - w, b.y - flap);
    ctx.quadraticCurveTo(b.x - w*0.4, b.y + 4, b.x, b.y);
    ctx.quadraticCurveTo(b.x + w*0.4, b.y + 4, b.x + w, b.y - flap);
    ctx.stroke();
  }

  // haunted hill + house silhouette
  ctx.fillStyle = "#0a0518";
  ctx.beginPath(); ctx.ellipse(W*0.12, H+40, W*0.35, 120, 0, Math.PI, 0); ctx.fill();
  const hx = W*0.12, hy = H-58, hw = 120, hh = 90;
  ctx.fillRect(hx-hw/2, hy-hh, hw, hh);
  ctx.beginPath();
  ctx.moveTo(hx-hw/2-14, hy-hh); ctx.lineTo(hx, hy-hh-64); ctx.lineTo(hx+hw/2+14, hy-hh); ctx.closePath(); ctx.fill();
  ctx.fillRect(hx-14, hy-hh-96, 28, 44); // crooked chimney
  // glowing windows
  ctx.fillStyle = "#ffb02e";
  ctx.fillRect(hx-hw/2+18, hy-hh+22, 20, 26);
  ctx.fillRect(hx+hw/2-38, hy-hh+22, 20, 26);
  ctx.fillStyle = "#0a0518";
  ctx.fillRect(hx-hw/2+26, hy-hh+22, 4, 26);
  ctx.fillRect(hx+hw/2-30, hy-hh+22, 4, 26);

  // ground
  const gg = ctx.createLinearGradient(0, H-70, 0, H);
  gg.addColorStop(0, "#160b26"); gg.addColorStop(1, "#07030f");
  ctx.fillStyle = gg; ctx.fillRect(0, H-70, W, 70);

  // jack-o-lanterns
  drawPumpkin(46, H-34, 26);
  drawPumpkin(W-52, H-30, 22);
  drawPumpkin(W*0.32, H-24, 16);
}
function drawPumpkin(x, y, r) {
  ctx.fillStyle = "#e06a12";
  ctx.beginPath(); ctx.ellipse(x, y, r, r*0.82, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#3d2408";
  ctx.fillRect(x-3, y-r*0.82-8, 6, 10);
  ctx.fillStyle = "#ffd23e";  // glowing face
  const ew = r*0.22;
  ctx.beginPath();
  ctx.moveTo(x-ew*2.2, y-r*0.15); ctx.lineTo(x-ew*1.2, y-r*0.5); ctx.lineTo(x-ew*0.2, y-r*0.15); ctx.closePath();
  ctx.moveTo(x+ew*0.2, y-r*0.15); ctx.lineTo(x+ew*1.2, y-r*0.5); ctx.lineTo(x+ew*2.2, y-r*0.15); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x-ew*1.6, y+r*0.25);
  ctx.quadraticCurveTo(x, y+r*0.55, x+ew*1.6, y+r*0.25);
  ctx.quadraticCurveTo(x, y+r*0.35, x-ew*1.6, y+r*0.25);
  ctx.fill();
}

function drawCandy(c) {
  const cx = c.x + Math.sin(c.wob) * c.wobAmp * 0.3;
  ctx.save(); ctx.translate(cx, c.y); ctx.rotate(Math.sin(c.rot) * 0.5);
  if (c.kind === "corn") {
    // candy corn triangle
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(11, 10); ctx.lineTo(-11, 10); ctx.closePath();
    ctx.fillStyle = "#ff8c1a"; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(6.2, 2); ctx.lineTo(-6.2, 2); ctx.closePath();
    ctx.fillStyle = "#ffd23e"; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(2.8, -6); ctx.lineTo(-2.8, -6); ctx.closePath();
    ctx.fillStyle = "#fff6e8"; ctx.fill();
  } else if (c.kind === "wrapped") {
    ctx.fillStyle = "#9b30ff";
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath();
    ctx.moveTo(16, 0); ctx.lineTo(8, -8); ctx.lineTo(8, 8); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#c26bff";
    roundRect(-9, -9, 18, 18, 4); ctx.fill();
    ctx.fillStyle = "#9b30ff";
    ctx.fillRect(-9, -2, 18, 4);
  } else { // pop (lollipop)
    ctx.strokeStyle = "#d8cfc0"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, 18); ctx.stroke();
    const pg = ctx.createLinearGradient(-10, -14, 10, 6);
    pg.addColorStop(0, "#ff4d6d"); pg.addColorStop(1, "#c9184a");
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(0, -4, 11, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -4, 6, Math.PI*0.9, Math.PI*1.6); ctx.stroke();
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function drawCat(k) {
  const x = k.x, baseY = H - 96, s = 1; // scale
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  // happy hop after a catch + pop-in when player 2 joins
  const pulse = (1 + k.pulse * 1.4) * easeOutBack(Math.max(0.001, k.spawnT));
  ctx.translate(x, baseY); ctx.scale(pulse, pulse); ctx.translate(-x, -baseY);

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(x, baseY + 46, 44, 10, 0, 0, Math.PI*2); ctx.fill();

  // tail (curled)
  ctx.strokeStyle = k.body; ctx.lineWidth = 13; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x + 34, baseY + 22);
  ctx.quadraticCurveTo(x + 66, baseY + 18, x + 62, baseY - 16);
  ctx.quadraticCurveTo(x + 60, baseY - 30, x + 48, baseY - 26);
  ctx.stroke();

  // body
  ctx.fillStyle = k.body;
  ctx.beginPath(); ctx.ellipse(x, baseY + 14, 34, 32, 0, 0, Math.PI*2); ctx.fill();

  // head
  ctx.beginPath(); ctx.arc(x, baseY - 26, 26, 0, Math.PI*2); ctx.fill();
  // ears
  ctx.beginPath();
  ctx.moveTo(x-24, baseY-40); ctx.lineTo(x-28, baseY-66); ctx.lineTo(x-8, baseY-48); ctx.closePath();
  ctx.moveTo(x+24, baseY-40); ctx.lineTo(x+28, baseY-66); ctx.lineTo(x+8, baseY-48); ctx.closePath();
  ctx.fill();
  // inner ears
  ctx.fillStyle = "#3a2b4d";
  ctx.beginPath();
  ctx.moveTo(x-21, baseY-44); ctx.lineTo(x-23, baseY-58); ctx.lineTo(x-12, baseY-48); ctx.closePath();
  ctx.moveTo(x+21, baseY-44); ctx.lineTo(x+23, baseY-58); ctx.lineTo(x+12, baseY-48); ctx.closePath();
  ctx.fill();

  // witch hat (Halloween!)
  ctx.fillStyle = k.hat;
  ctx.beginPath();
  ctx.moveTo(x-24, baseY-52); ctx.lineTo(x+24, baseY-52); ctx.lineTo(x+2, baseY-104); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+2, baseY-104); ctx.quadraticCurveTo(x-8, baseY-112, x-16, baseY-104);
  ctx.quadraticCurveTo(x-6, baseY-106, x+2, baseY-104); ctx.fill();
  ctx.fillStyle = k.hatDark;
  ctx.fillRect(x-30, baseY-58, 60, 8);
  ctx.fillStyle = k.buckle;
  ctx.beginPath(); ctx.arc(x, baseY-54, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = k.hat;
  ctx.beginPath(); ctx.arc(x, baseY-54, 2.6, 0, Math.PI*2); ctx.fill();

  // glowing eyes
  const blink = 1; // (could add blinking later)
  ctx.fillStyle = "#b6ff4d";
  ctx.beginPath(); ctx.ellipse(x-10, baseY-28, 6.5*blink, 7.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+10, baseY-28, 6.5*blink, 7.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = k.body;
  ctx.beginPath(); ctx.ellipse(x-10, baseY-28, 2.2, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+10, baseY-28, 2.2, 5, 0, 0, Math.PI*2); ctx.fill();

  // nose + whiskers
  ctx.fillStyle = "#ff8fb3";
  ctx.beginPath();
  ctx.moveTo(x-3.5, baseY-16); ctx.lineTo(x+3.5, baseY-16); ctx.lineTo(x, baseY-12); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "rgba(220,220,230,0.8)"; ctx.lineWidth = 1.4;
  for (const side of [-1, 1]) for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x + side*14, baseY - 14 + i*4);
    ctx.lineTo(x + side*34, baseY - 18 + i*6);
    ctx.stroke();
  }
  // player label (only the 2nd cat wears one)
  if (k.label) {
    ctx.fillStyle = "#ffffff"; ctx.font = "800 15px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(k.label, x, baseY - 112);
    ctx.textAlign = "left";
  }
  ctx.restore();
}

function drawHUD() {
  ctx.textBaseline = "top";
  // score (top-left)
  ctx.fillStyle = "rgba(10,5,20,0.55)";
  roundRect(12, 12, 150, 52, 12); ctx.fill();
  ctx.fillStyle = "#ffd23e"; ctx.font = "700 15px -apple-system, sans-serif";
  ctx.fillText("SCORE", 26, 20);
  ctx.fillStyle = "#ffffff"; ctx.font = "800 26px -apple-system, sans-serif";
  ctx.fillText(String(score), 26, 38);

  // misses as candy icons (top-right)
  ctx.fillStyle = "rgba(10,5,20,0.55)";
  roundRect(W-172, 12, 160, 52, 12); ctx.fill();
  ctx.fillStyle = "#ffd23e"; ctx.font = "700 15px -apple-system, sans-serif";
  ctx.fillText("MISSED", W-158, 20);
  for (let i = 0; i < 3; i++) {
    const px = W - 150 + i * 44, py = 52;
    if (i < misses) {
      // cracked / lost candy (gray X)
      ctx.strokeStyle = "#5a5a6e"; ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(px-9, py-9); ctx.lineTo(px+9, py+9);
      ctx.moveTo(px+9, py-9); ctx.lineTo(px-9, py+9);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#ff8c1a";
      ctx.beginPath();
      ctx.moveTo(px, py-11); ctx.lineTo(px+9, py+8); ctx.lineTo(px-9, py+8); ctx.closePath();
      ctx.fill();
    }
  }
}

function drawCenterText(title, lines, accent) {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(5,2,12,0.72)";
  const bw = Math.min(W - 48, 460), bh = 120 + lines.length * 34;
  roundRect(W/2 - bw/2, H/2 - bh/2, bw, bh, 18); ctx.fill();
  ctx.strokeStyle = accent; ctx.lineWidth = 2;
  roundRect(W/2 - bw/2, H/2 - bh/2, bw, bh, 18); ctx.stroke();

  ctx.fillStyle = "#ff7a1a";
  ctx.font = "900 34px -apple-system, sans-serif";
  ctx.fillText(title, W/2, H/2 - bh/2 + 52);

  ctx.fillStyle = "#e8dff5"; ctx.font = "400 16px -apple-system, sans-serif";
  lines.forEach((ln, i) => ctx.fillText(ln, W/2, H/2 - bh/2 + 104 + i * 32));

  ctx.fillStyle = accent; ctx.font = "700 17px -apple-system, sans-serif";
  ctx.fillText(state === STATE.TITLE ? "Tap or press Space to play" : "Tap or press Space to play again",
               W/2, H/2 + bh/2 - 30);
  ctx.textAlign = "left";
}

function drawBackButton() {
  const w = 122, h = 38;
  const x = W / 2 - w / 2, y = 12;
  backBtn = { x, y, w, h };
  ctx.fillStyle = "rgba(10,5,20,0.55)";
  roundRect(x, y, w, h, 19); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2;
  roundRect(x, y, w, h, 19); ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.font = "700 17px -apple-system, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("‹ Arcade", W / 2, y + h / 2 + 1);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}
function hitBackButton(e) {
  if (!backBtn) return false;
  const x = e.clientX || 0, y = e.clientY || 0;
  return x >= backBtn.x && x <= backBtn.x + backBtn.w && y >= backBtn.y && y <= backBtn.y + backBtn.h;
}

function draw() {
  ctx.save();
  drawBackground();
  for (const c of candies) drawCandy(c);
  drawParticles();
  if (state !== STATE.TITLE) for (const k of cats) drawCat(k);
  drawFloaters();
  if (state === STATE.PLAYING) drawHUD();

  // red flash on miss (under the panels so text stays readable)
  if (missFlash > 0) {
    ctx.fillStyle = "rgba(255,40,60," + (missFlash * 0.35).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  drawBackButton();

  if (state === STATE.TITLE) {
    const best = topScores.length ? topScores[0] : 0;
    drawCenterText("BLACK CAT", [
      "CANDY CATCH",
      "Catch the falling candy. Miss 3 and the",
      "ghosts get you.",
      best > 0 ? ("Best score: " + best) : "No scores yet — set one!"
    ], "#9b30ff");
  } else if (state === STATE.OVER) {
    const lines = [
      "Score: " + score + (newBest ? "  —  NEW BEST!" : ""),
      "",
      "TOP SCORES"
    ];
    topScores.forEach((s, i) => lines.push((i+1) + ".  " + s));
    if (!topScores.length) lines.push("No scores saved.");
    drawCenterText("GAME OVER", lines, "#ff4d6d");
  }
  ctx.restore();
}

// ---------- main loop ----------
function frame(now) {
  update(now);
  draw();
  requestAnimationFrame(frame);
}
resetCats();
requestAnimationFrame(frame);
</script>
</body>
</html>
