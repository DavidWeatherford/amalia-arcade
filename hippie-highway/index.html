<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hippie Highway! 🚐</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #79c7e8;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ================= Hippie Highway! — a chase-cam lane-dodger for Amalia's Arcade =================
// Above-and-behind perspective: the road narrows to a horizon, traffic grows as it
// approaches. You drive a 1960s VW van (rear 3/4 view) across 6 lanes.
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, DPR = 1;
let CX = 0;                 // screen center x
let HORIZON = 0;            // height of the sky band at the top
let PLAYER_Y = 0;           // screen y of the van (chase-cam plane, t = 0)
let LANE_PX = 58;           // lane width in px at the player plane
let VAN_S = 0.5;            // van/car draw scale: ~0.84 lane widths

const STATE = { TITLE: 0, PLAYING: 1, OVER: 2 };
let state = STATE.TITLE;

// ---------- sound effects (Web Audio, no files) ----------
const sfx = (() => {
  let ac = null;
  function ensure() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, delay, dur, type, vol, slideTo) {
    const a = ensure(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(Math.max(30, freq), t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  let eng = null;
  function engineStart() {
    const a = ensure(); if (!a || eng) return;
    try {
      const o1 = a.createOscillator(), o2 = a.createOscillator();
      const f = a.createBiquadFilter(), g = a.createGain();
      o1.type = "sawtooth"; o2.type = "sawtooth";
      o1.frequency.value = 52; o2.frequency.value = 52.8;
      f.type = "lowpass"; f.frequency.value = 260;
      g.gain.value = 0.0;
      g.gain.linearRampToValueAtTime(0.045, a.currentTime + 0.4);
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(a.destination);
      o1.start(); o2.start();
      eng = { o1, o2, g };
    } catch (e) {}
  }
  function engineStop() {
    if (!eng || !ac) { eng = null; return; }
    try {
      const e2 = eng; eng = null;
      e2.g.gain.cancelScheduledValues(ac.currentTime);
      e2.g.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.25);
      setTimeout(() => { try { e2.o1.stop(); e2.o2.stop(); } catch (x) {} }, 400);
    } catch (e2x) { eng = null; }
  }
  const BASS = [110, 0, 130.81, 0, 146.83, 0, 130.81, 110, 98, 0, 110, 0, 146.83, 164.81, 130.81, 0];
  let beatI = 0;
  return {
    unlock() { ensure(); },
    lane()  { tone(520, 0, 0.07, "square", 0.05, 780); },
    near()  { tone(900, 0, 0.12, "sine", 0.09, 1600); },
    ping()  { tone(880, 0, 0.09, "square", 0.06); tone(1318, 0.08, 0.12, "square", 0.06); },
    crash() {
      tone(220, 0, 0.4, "sawtooth", 0.12, 40);
      tone(110, 0.05, 0.5, "square", 0.1, 35);
    },
    start() { tone(392, 0, 0.09, "square", 0.07); tone(523, 0.09, 0.09, "square", 0.07); tone(659, 0.18, 0.16, "square", 0.07); },
    musicBeat() {
      const f = BASS[beatI % BASS.length]; beatI++;
      if (f) tone(f, 0, 0.16, "triangle", 0.05);
    },
    engineStart, engineStop
  };
})();

// ---------- persistent best ----------
const BEST_KEY = "hippieHighway.best.v1";
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

// ---------- flat road ----------
// off = lateral offset from road center in lane units (lane i sits at i - (LANES-1)/2).
// t = 1 at the top edge of the screen, t = 0 at the van's plane. No perspective: constant width.
function proj(off, t) {
  return {
    x: CX + off * LANE_PX,
    y: PLAYER_Y * (1 - t),
    s: 1
  };
}

// ---------- game state ----------
const LANES = 10;
let lane = LANES / 2 - 1, lanePos = LANES / 2 - 1, laneCooldown = 0;   // lanePos glides toward lane
let rate = 0, elapsed = 0, score = 0, scorePop = 0, newBest = false;
let obstacles = [];   // {lane, t, ci (color idx), passed}
let spawnT = 0, lastBlocked = [], dashPhase = 0, beatT = 0;
let roadside = [];    // {side:-1|1, off, t, kind, s}
let particles = [], popups = [];
let shake = 0, backBtn = null;

const CAR_COLORS = [
  { body: "#d94040", dark: "#a52f2f" },
  { body: "#2fa39a", dark: "#1f7a74" },
  { body: "#e08a2e", dark: "#a86420" },
  { body: "#8a5fbf", dark: "#66428f" },
  { body: "#e8e8ee", dark: "#b9b9c6" },
];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2;
  HORIZON = Math.round(H * 0.30);
  PLAYER_Y = Math.round(H * 0.86);
  LANE_PX = Math.max(34, Math.min(76, W / (LANES + 1))); // keep all lanes on screen
  VAN_S = (LANE_PX * 0.84) / 100;
  initRoadside();
}
function initRoadside() {
  roadside = [];
  for (let i = 0; i < 26; i++) {
    roadside.push({
      side: Math.random() < 0.5 ? -1 : 1,
      off: 3.9 + Math.random() * 2.4,          // lane-units beyond road edge
      t: Math.random(),
      kind: Math.random() < 0.62 ? "cactus" : (Math.random() < 0.5 ? "rock" : "bush"),
      ph: Math.random() * 10
    });
  }
}
window.addEventListener("resize", resize);

// ---------- flow ----------
function startGame() {
  state = STATE.PLAYING;
  elapsed = 0; score = 0; scorePop = 0; newBest = false;
  obstacles = []; particles = []; popups = []; shake = 0;
  lane = LANES / 2 - 1; lanePos = LANES / 2 - 1; laneCooldown = 0; lastBlocked = [];
  spawnT = 1.0; dashPhase = 0; beatT = 0;
  sfx.start(); sfx.engineStart();
}
function endGame() {
  state = STATE.OVER;
  shake = 12;
  sfx.crash(); sfx.engineStop();
  const p = proj(lanePos - (LANES - 1) / 2, 0);
  burst(p.x, p.y - 30, 16);
  const s = Math.floor(score);
  if (s > best) { best = s; newBest = s > 0; saveBest(); }
}
function moveLane(dir) {
  if (state !== STATE.PLAYING || laneCooldown > 0) return;
  const next = Math.max(0, Math.min(LANES - 1, lane + dir));
  if (next === lane) return;
  lane = next; laneCooldown = 0.13;
  sfx.lane();
  const p = proj(lanePos - (LANES - 1) / 2, 0);
  dust(p.x, p.y + 40, 4);
}

// ---------- input ----------
window.addEventListener("keydown", e => {
  sfx.unlock();
  if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  if (state !== STATE.PLAYING && (e.key === " " || e.key === "ArrowUp" || e.key === "Enter")) { startGame(); return; }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") moveLane(-1);
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") moveLane(1);
});
canvas.addEventListener("pointerdown", e => {
  sfx.unlock();
  const x = e.clientX || 0, y = e.clientY || 0;
  if (backBtn && x >= backBtn.x && x <= backBtn.x + backBtn.w &&
      y >= backBtn.y && y <= backBtn.y + backBtn.h) { window.location.href = "../"; return; }
  if (state !== STATE.PLAYING) { startGame(); return; }
  moveLane(x < W / 2 ? -1 : 1);
});

// ---------- particles & popups ----------
function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: x + (Math.random() - 0.5) * 30, y: y - Math.random() * 8,
      vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 120,
      life: 0.35 + Math.random() * 0.25, maxLife: 0.6, size: 3 + Math.random() * 4, color: "#d9b380" });
  }
}
function burst(x, y, n) {
  const cols = ["#2e6fd8", "#f5ead2", "#ffb02e", "#888890"];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      life: 0.4 + Math.random() * 0.35, maxLife: 0.75, size: 3 + Math.random() * 5,
      color: cols[(Math.random() * cols.length) | 0] });
  }
}

// ---------- update ----------
let lastT = 0;
function update(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 44 * dt; p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 34);
  if (scorePop > 0) scorePop = Math.max(0, scorePop - dt);
  if (laneCooldown > 0) laneCooldown -= dt;

  const drift = state === STATE.PLAYING ? rate : 0.06;
  dashPhase = (dashPhase + drift * dt) % 0.12;
  for (const r of roadside) {
    r.t -= drift * dt;
    if (r.t < -0.05) { r.t = 1 + Math.random() * 0.1; r.side = Math.random() < 0.5 ? -1 : 1; r.off = LANES / 2 + 0.9 + Math.random() * 2.4; }
  }

  if (state !== STATE.PLAYING) return;
  elapsed += dt;
  rate = Math.min(0.5 + elapsed * 0.006, 1.25);   // gentle ramp, a bit livelier late

  beatT -= dt;
  if (beatT <= 0) { sfx.musicBeat(); beatT = 0.19; }

  lanePos += (lane - lanePos) * Math.min(1, dt * 13);

  // spawn waves — more cars the longer the run; always leave the van a way through
  spawnT -= dt;
  if (spawnT <= 0) {
    const free = [];
    for (let l = 0; l < LANES; l++) if (lastBlocked.indexOf(l) < 0) free.push(l);
    const all = []; for (let l = 0; l < LANES; l++) all.push(l);
    const pool = free.length >= 4 ? free : all;
    let k = 2;
    if (elapsed > 105) k = 6;
    else if (elapsed > 75) k = 5;
    else if (elapsed > 45) k = 4;
    else if (elapsed > 20) k = 3;
    k = Math.min(k, 6, pool.length);
    const picks = [];
    for (let i = 0; i < k; i++) picks.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
    picks.forEach((ln, i) => {
      obstacles.push({ lane: ln, t: 1.02 + i * 0.07, ci: (Math.random() * CAR_COLORS.length) | 0, passed: false });
    });
    lastBlocked = picks.slice();
    spawnT = Math.max(0.35, 1.0 - elapsed * 0.004); // waves come faster over time
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    const prevT = o.t;
    o.t -= rate * dt;
    if (o.t < -0.12) { obstacles.splice(i, 1); continue; }
    const dl = Math.abs(lanePos - o.lane);
    // collision as it crosses the van's plane
    if ((prevT > 0 && o.t <= 0.02 || Math.abs(o.t) < 0.07) && dl < 0.5) { endGame(); return; }
    // near-miss bonus for a close shave
    if (!o.passed && prevT > 0 && o.t <= 0) {
      o.passed = true;
      if (dl >= 0.5 && dl < 1.6) {
        score += 5;
        const p = proj(lanePos - (LANES - 1) / 2, 0);
        popups.push({ x: p.x, y: p.y - 110, text: "CLOSE! +5", life: 0.8 });
        sfx.near();
      }
    }
  }

  const before = Math.floor(score);
  score += rate * dt * 26;
  const after = Math.floor(score);
  if (Math.floor(after / 100) > Math.floor(before / 100)) { sfx.ping(); scorePop = 0.6; }
}

// ---------- drawing ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, "#5fb4e8"); sky.addColorStop(1, "#cfeefb");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HORIZON + 1);
  // sun
  ctx.fillStyle = "rgba(255,240,180,0.9)";
  ctx.beginPath(); ctx.arc(W - 70, 64, 30, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff3c4";
  ctx.beginPath(); ctx.arc(W - 70, 64, 22, 0, Math.PI * 2); ctx.fill();
  // clouds
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  const clouds = [[0.18, 0.10, 1], [0.55, 0.06, 0.7], [0.8, 0.16, 0.85]];
  for (const [fx, fy, s] of clouds) {
    const x = fx * W, y = fy * HORIZON + 20;
    ctx.beginPath();
    ctx.ellipse(x, y, 44 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 30 * s, y + 5 * s, 26 * s, 10 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 32 * s, y + 6 * s, 28 * s, 11 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // desert floor
  const sand = ctx.createLinearGradient(0, HORIZON, 0, H);
  sand.addColorStop(0, "#d99a55"); sand.addColorStop(1, "#c07f3e");
  ctx.fillStyle = sand; ctx.fillRect(0, HORIZON, W, H - HORIZON);
}

function drawRoadside() {
  // far to near so near details overlap correctly
  const sorted = roadside.slice().sort((a, b2) => b2.t - a.t);
  for (const r of sorted) {
    if (r.t < -0.05 || r.t > 1.05) continue;
    const p = proj(r.side * r.off, r.t);
    const s = p.s;
    if (r.kind === "cactus") {
      ctx.fillStyle = "#2e8b57";
      const ch = 46 * s;
      rr(p.x - 7 * s, p.y - ch, 14 * s, ch, 6 * s); ctx.fill();
      rr(p.x - 20 * s, p.y - ch + 14 * s, 12 * s, 20 * s, 5 * s); ctx.fill();
      rr(p.x + 8 * s, p.y - ch + 20 * s, 12 * s, 16 * s, 5 * s); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      rr(p.x - 7 * s, p.y - ch, 5 * s, ch, 2 * s); ctx.fill();
    } else if (r.kind === "rock") {
      ctx.fillStyle = "#8d8d99";
      ctx.beginPath(); ctx.ellipse(p.x, p.y - 6 * s, 16 * s, 9 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      ctx.beginPath(); ctx.ellipse(p.x - 4 * s, p.y - 9 * s, 7 * s, 3.5 * s, -0.3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "#4e9b47";
      ctx.beginPath(); ctx.ellipse(p.x, p.y - 8 * s, 18 * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#5fb45a";
      ctx.beginPath(); ctx.ellipse(p.x - 5 * s, p.y - 11 * s, 10 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawRoad() {
  // asphalt trapezoid, slightly past the van plane
  const RH = LANES / 2 + 0.2; // road half-width in lane units
  const a = proj(-RH, 1.0), b2 = proj(RH, 1.0), c = proj(RH, -0.08), d = proj(-RH, -0.08);
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, "#4a4a63"); g.addColorStop(1, "#38384e");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  ctx.closePath(); ctx.fill();
  // yellow edge lines
  ctx.fillStyle = "#ffd23f";
  for (const e of [-RH + 0.15, RH - 0.15]) {
    const p1 = proj(e, 1.0), p2 = proj(e, -0.08);
    ctx.beginPath();
    ctx.moveTo(p1.x - 2 * p1.s, p1.y); ctx.lineTo(p1.x + 2 * p1.s, p1.y);
    ctx.lineTo(p2.x + 2 * p2.s, p2.y); ctx.lineTo(p2.x - 2 * p2.s, p2.y);
    ctx.closePath(); ctx.fill();
  }
  // white lane dashes, scrolling toward the viewer
  ctx.fillStyle = "#f5f5f5";
  for (let i = 1; i < LANES; i++) {
    const bl = i - LANES / 2;   // lane-boundary offset
    for (let t = 1.0 - dashPhase; t > -0.06; t -= 0.12) {
      const p1 = proj(bl, Math.max(-0.06, t - 0.055)), p2 = proj(bl, t);
      const wdt = 2.2 * p1.s;
      ctx.beginPath();
      ctx.moveTo(p1.x - wdt, p1.y); ctx.lineTo(p1.x + wdt, p1.y);
      ctx.lineTo(p2.x + wdt, p2.y); ctx.lineTo(p2.x - wdt, p2.y);
      ctx.closePath(); ctx.fill();
    }
  }
}

// The star: 1960s VW Type 2 van in VW blue, rear 3/4 chase-cam view.
function drawVan(sx, sy, s, lean, bonked) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(lean * 0.1);
  ctx.scale(s, s);
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(0, 48, 52, 12, 0, 0, Math.PI * 2); ctx.fill();
  // wheels
  ctx.fillStyle = "#1c1c22";
  rr(-50, 20, 15, 26, 6); ctx.fill();
  rr(35, 20, 15, 26, 6); ctx.fill();
  // rear body
  const bg = ctx.createLinearGradient(0, -44, 0, 44);
  bg.addColorStop(0, "#4a8de0"); bg.addColorStop(1, "#2456a8");
  ctx.fillStyle = bg; rr(-44, -40, 88, 82, 13); ctx.fill();
  // roof (seen from above)
  ctx.fillStyle = "#f5ead2";
  ctx.beginPath();
  ctx.moveTo(-38, -40); ctx.lineTo(38, -40); ctx.lineTo(27, -66); ctx.lineTo(-27, -66);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-38, -40); ctx.lineTo(38, -40); ctx.lineTo(27, -66); ctx.lineTo(-27, -66);
  ctx.closePath(); ctx.stroke();
  // rear window
  ctx.fillStyle = "#173a5e"; rr(-28, -33, 56, 22, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.28)"; rr(-28, -33, 56, 8, 7); ctx.fill();
  if (bonked) {
    ctx.strokeStyle = "#0e0e14"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-16, -28); ctx.lineTo(-6, -18); ctx.moveTo(-6, -28); ctx.lineTo(-16, -18);
    ctx.moveTo(6, -28); ctx.lineTo(16, -18); ctx.moveTo(16, -28); ctx.lineTo(6, -18);
    ctx.stroke();
  }
  // cream beltline (two-tone splitty!)
  ctx.fillStyle = "#f5ead2"; rr(-44, -6, 88, 10, 4); ctx.fill();
  // VW roundel on the hatch
  ctx.fillStyle = "#f5f5f5";
  ctx.beginPath(); ctx.arc(0, 12, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#2456a8"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-3.5, 9.5); ctx.lineTo(0, 15); ctx.lineTo(3.5, 9.5); ctx.stroke();
  // taillights
  ctx.fillStyle = "#d93a3a"; rr(-41, 2, 11, 22, 5); ctx.fill(); rr(30, 2, 11, 22, 5); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)"; rr(-41, 2, 11, 8, 5); ctx.fill(); rr(30, 2, 11, 8, 5); ctx.fill();
  // chrome bumper + plate
  ctx.fillStyle = "#cfd6dd"; rr(-47, 30, 94, 11, 5); ctx.fill();
  ctx.fillStyle = "#ffffff"; rr(-11, 30.5, 22, 10, 2); ctx.fill();
  ctx.fillStyle = "#2456a8"; ctx.font = "bold 8px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("GROOVY", 0, 36);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.restore();
}

// Oncoming traffic: same-size cars, front view.
function drawCar(sx, sy, s, ci) {
  const col = CAR_COLORS[ci % CAR_COLORS.length];
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(0, 48, 52, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1c1c22";
  rr(-50, 20, 15, 26, 6); ctx.fill();
  rr(35, 20, 15, 26, 6); ctx.fill();
  const bg = ctx.createLinearGradient(0, -44, 0, 44);
  bg.addColorStop(0, col.body); bg.addColorStop(1, col.dark);
  ctx.fillStyle = bg; rr(-44, -40, 88, 82, 13); ctx.fill();
  // roof
  ctx.fillStyle = col.dark;
  ctx.beginPath();
  ctx.moveTo(-36, -40); ctx.lineTo(36, -40); ctx.lineTo(26, -64); ctx.lineTo(-26, -64);
  ctx.closePath(); ctx.fill();
  // windshield
  ctx.fillStyle = "#173a5e"; rr(-30, -34, 60, 20, 6); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.28)"; rr(-30, -34, 60, 7, 6); ctx.fill();
  // grille
  ctx.fillStyle = "rgba(0,0,0,0.35)"; rr(-18, 4, 36, 14, 5); ctx.fill();
  // headlights (they're coming at you!)
  for (const hx of [-28, 28]) {
    ctx.fillStyle = "rgba(255,233,168,0.35)";
    ctx.beginPath(); ctx.arc(hx, 22, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffe9a8";
    ctx.beginPath(); ctx.arc(hx, 22, 7, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#cfd6dd"; rr(-47, 30, 94, 11, 5); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.textAlign = "center";
  ctx.font = "800 15px -apple-system, 'Segoe UI', sans-serif";
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = "#1c1c22"; ctx.fillText(p.text, p.x + 1, p.y + 2);
    ctx.fillStyle = "#ffd23f"; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = "left";
}

function drawBackButton() {
  const w = 122, h = 38, x = 12, y = 12;
  backBtn = { x, y, w, h };
  ctx.fillStyle = "rgba(20,32,52,0.72)";
  rr(x, y, w, h, 19); ctx.fill();
  ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2;
  rr(x, y, w, h, 19); ctx.stroke();
  ctx.fillStyle = "#ffd23f"; ctx.font = "700 17px -apple-system, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("‹ Arcade", x + w / 2, y + h / 2 + 1);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}

function drawHUD() {
  // dark pill so the score stays readable over the sky/sun
  ctx.fillStyle = "rgba(20,32,52,0.55)";
  rr(W - 118, 8, 106, 58, 14); ctx.fill();
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd23f";
  ctx.font = "700 14px -apple-system, sans-serif";
  ctx.fillText("BEST " + best, W - 20, 28);
  const pop = 1 + scorePop * 0.7;
  ctx.save();
  ctx.translate(W - 20, 52); ctx.scale(pop, pop);
  ctx.font = "800 28px -apple-system, sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(String(Math.floor(score)).padStart(5, "0"), 0, 0);
  ctx.restore();
  ctx.textAlign = "left";
}

function drawPanel(title, lines, accent, blinkLine) {
  const w = Math.min(W - 60, 430), h = 118 + lines.length * 30;
  const x = W / 2 - w / 2, y = H / 2 - h / 2;
  ctx.fillStyle = "rgba(20,32,52,0.82)";
  rr(x, y, w, h, 24); ctx.fill();
  ctx.strokeStyle = accent; ctx.lineWidth = 4;
  rr(x, y, w, h, 24); ctx.stroke();
  ctx.textAlign = "center";
  ctx.fillStyle = accent; ctx.font = "900 38px -apple-system, sans-serif";
  ctx.fillText(title, W / 2, y + 60);
  ctx.fillStyle = "#ffffff"; ctx.font = "700 18px -apple-system, sans-serif";
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + 104 + i * 30));
  if (blinkLine && Math.floor(performance.now() / 500) % 2 === 0) {
    ctx.fillStyle = "#ffd23f"; ctx.font = "800 16px -apple-system, sans-serif";
    ctx.fillText(blinkLine, W / 2, y + h - 22);
  }
  ctx.textAlign = "left";
  return { x, y, w, h };
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  drawRoad();
  drawRoadside();

  // traffic, far to near
  const sorted = obstacles.slice().sort((a, b2) => b2.t - a.t);
  for (const o of sorted) {
    if (o.t < -0.1 || o.t > 1.1) continue;
    const p = proj(o.lane - (LANES - 1) / 2, o.t);
    drawCar(p.x, p.y, p.s * VAN_S, o.ci);
  }

  // the van
  const vp = proj(lanePos - (LANES - 1) / 2, 0);
  const lean = Math.max(-1, Math.min(1, (lane - lanePos)));
  if (state !== STATE.OVER) {
    drawVan(vp.x, vp.y, VAN_S, lean, false);
  } else {
    drawVan(vp.x, vp.y, VAN_S, 0, true);
  }

  drawParticles();
  drawPopups();
  drawBackButton();
  if (state === STATE.PLAYING) drawHUD();
  if (state === STATE.TITLE) {
    const panel = drawPanel("HIPPIE HIGHWAY", [
      "Dodge the traffic in your groovy van!",
      "Arrows / A D or tap a side to switch lanes.",
      best > 0 ? ("Best cruise: " + best) : "How far can you roll?"
    ], "#ffd23f", "TAP OR PRESS SPACE TO ROLL");
    // show off the van above the panel
    drawVan(W / 2, panel.y - 64, VAN_S * 1.7, Math.sin(performance.now() / 400) * 0.4, false);
  } else if (state === STATE.OVER) {
    drawHUD();
    drawPanel("WIPEOUT!", [
      "Score: " + Math.floor(score) + (newBest ? "  —  NEW BEST!" : ""),
      "Best: " + best,
      "Far out! Tap to roll again."
    ], "#ff5e78", null);
  }
  ctx.restore();
}

// ---------- main loop ----------
function frame(now) {
  update(now);
  draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
