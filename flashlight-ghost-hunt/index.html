<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flashlight Ghost Hunt! 👻</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060410;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ============ Flashlight Ghost Hunt! — a spooky-cute seek & boop game for Amalia's Arcade ============
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

const STATE = { TITLE: 0, PLAYING: 1, OVER: 2 };
let state = STATE.TITLE;

// ---------- sound effects (Web Audio, no files) ----------
const sfx = (() => {
  let ac = null;
  function ensure() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, delay, dur, type, vol, slideTo) {
    const a = ensure(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    unlock() { ensure(); },
    boop() { tone(880, 0, 0.12, "triangle", 0.16); tone(1318, 0.08, 0.18, "triangle", 0.16); },
    miss() { tone(196, 0, 0.32, "sine", 0.12, 130); },
    ping() { tone(1046, 0, 0.10, "sine", 0.14); tone(1568, 0.09, 0.16, "sine", 0.14); },
    over() { tone(523, 0, 0.16, "triangle", 0.14); tone(392, 0.15, 0.16, "triangle", 0.14); tone(330, 0.30, 0.16, "triangle", 0.14); tone(262, 0.45, 0.30, "triangle", 0.14); },
    start(){ tone(523, 0, 0.10, "triangle", 0.13); tone(659, 0.08, 0.10, "triangle", 0.13); tone(784, 0.16, 0.16, "triangle", 0.13); }
  };
})();

// ---------- persistent best ----------
const BEST_KEY = "flashlightGhostHunt.best.v1";
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }

// ---------- game state ----------
const BEAM_R = 170;
const beam = { x: 0, y: 0, tx: 0, ty: 0, flick: 1 };
let ghosts = [];      // {x,y,vx,vy,r,lit,wob,booped,spinT}
let motes = [];       // dust motes {x,y,vx,vy,r,tw}
let particles = [];   // sparkles {x,y,vx,vy,life,maxLife,size,color}
let floaters = [];    // {x,y,t,text,color}
let elapsed = 0, time = 0, score = 0, misses = 0;
let spawnTimer = 0, shake = 0, newBest = false;
let backBtn = null;
const keys = {};

// difficulty: gentle ramp across ~2 minutes
function spawnInterval() { return 2.4 - Math.min(elapsed * 0.01, 1.2); }   // 2.4s -> 1.2s
function driftSpeed()    { return 40 + Math.min(elapsed * (70 / 120), 70); } // 40 -> 110 px/s
function maxGhosts()     { return 3 + Math.floor(Math.min(elapsed / 40, 3)); } // 3 -> 6

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  beam.x = beam.tx = W / 2; beam.y = beam.ty = H / 2;
  initMotes();
}
function initMotes() {
  motes = [];
  for (let i = 0; i < 26; i++) motes.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 14, vy: -4 - Math.random() * 10,
    r: 1 + Math.random() * 2, tw: Math.random() * Math.PI * 2
  });
}
window.addEventListener("resize", resize);

// ---------- flow ----------
function startGame() {
  state = STATE.PLAYING;
  elapsed = 0; score = 0; misses = 0; newBest = false;
  ghosts = []; particles = []; floaters = []; shake = 0;
  spawnTimer = 0.8;
  beam.tx = W / 2; beam.ty = H / 2;
  sfx.start();
}
function endGame() {
  state = STATE.OVER;
  shake = 10;
  sfx.over();
  if (score > best) { best = score; newBest = score > 0; saveBest(); }
}
function spawnGhost() {
  const r = 24 + Math.random() * 10;
  const side = (Math.random() * 4) | 0;
  let x, y;
  if (side === 0)      { x = 60 + Math.random() * (W - 120); y = 100; }
  else if (side === 1) { x = 60 + Math.random() * (W - 120); y = H - 70; }
  else if (side === 2) { x = 60; y = 120 + Math.random() * (H - 240); }
  else                 { x = W - 60; y = 120 + Math.random() * (H - 240); }
  // drift roughly toward the middle so it doesn't instantly escape
  const ta = Math.atan2(H / 2 - y, W / 2 - x) + (Math.random() - 0.5) * 1.7;
  const sp = driftSpeed();
  ghosts.push({ x, y, vx: Math.cos(ta) * sp, vy: Math.sin(ta) * sp * 0.7,
                r, lit: 0, wob: Math.random() * 6, booped: false, spinT: 0 });
}
function tryBoop(x, y) {
  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i];
    if (g.booped) continue;
    if (Math.hypot(x - g.x, y - g.y) <= g.r + 16 && g.lit > 0.35) {
      g.booped = true; g.spinT = 0.0001;
      score++;
      sfx.boop();
      sparkle(g.x, g.y);
      floaters.push({ x: g.x, y: g.y - g.r - 12, t: 0, text: "+1", color: "#ffd23e" });
      if (score % 25 === 0) sfx.ping();
      return true;
    }
  }
  return false;   // tapping darkness: no penalty, just nothing
}

// ---------- input ----------
window.addEventListener("keydown", e => {
  sfx.unlock();
  keys[e.key] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  if (state !== STATE.PLAYING && (e.key === " " || e.key === "Enter")) startGame();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });
canvas.addEventListener("pointerdown", e => {
  sfx.unlock();
  if (hitBackButton(e)) { window.location.href = "../"; return; }
  beam.tx = e.clientX || 0; beam.ty = e.clientY || 0;
  if (state !== STATE.PLAYING) { startGame(); return; }
  tryBoop(e.clientX || 0, e.clientY || 0);
});
canvas.addEventListener("pointermove", e => {
  beam.tx = e.clientX || 0; beam.ty = e.clientY || 0;
});

// ---------- particles ----------
function sparkle(x, y) {
  const colors = ["#ffffff", "#ffd23e", "#ffb3d9", "#cfe8ff"];
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
      life: 0.5 + Math.random() * 0.35, maxLife: 0.85,
      size: 2 + Math.random() * 3.5, color: colors[(Math.random() * colors.length) | 0] });
  }
}

// how lit is a point? 1 deep in the beam, 0 in darkness
function litAmountAt(x, y) {
  const d = Math.hypot(x - beam.x, y - beam.y);
  const r = BEAM_R * beam.flick;
  return Math.max(0, Math.min(1, 1 - (d - r * 0.45) / (r * 0.65)));
}

// ---------- update ----------
let lastT = 0;
function update(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  time += dt;

  // beam: springy follow + subtle flicker (always alive, even on title)
  beam.flick = 1 + Math.sin(time * 31) * 0.018 + Math.sin(time * 17.3 + 1.7) * 0.022;
  const kbs = 460 * dt;
  if (keys["ArrowLeft"]  || keys["a"] || keys["A"]) beam.tx -= kbs;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) beam.tx += kbs;
  if (keys["ArrowUp"]    || keys["w"] || keys["W"]) beam.ty -= kbs;
  if (keys["ArrowDown"]  || keys["s"] || keys["S"]) beam.ty += kbs;
  beam.tx = Math.max(0, Math.min(W, beam.tx));
  beam.ty = Math.max(0, Math.min(H, beam.ty));
  const lk = Math.min(1, dt * 9);
  beam.x += (beam.tx - beam.x) * lk;
  beam.y += (beam.ty - beam.y) * lk;

  for (const m of motes) {
    m.x += m.vx * dt; m.y += m.vy * dt; m.tw += dt * 2;
    if (m.x < -10) m.x = W + 10; if (m.x > W + 10) m.x = -10;
    if (m.y < -10) m.y = H + 10; if (m.y > H + 10) m.y = -10;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 44 * dt; f.t += dt;
    if (f.t > 0.9) floaters.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 40);

  if (state !== STATE.PLAYING) return;
  elapsed += dt;

  // spawn ghosts on a gentle ramp
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    if (ghosts.filter(g => !g.booped).length < maxGhosts()) {
      spawnGhost();
      spawnTimer = spawnInterval();
    } else {
      spawnTimer = 0.3;
    }
  }

  for (let i = ghosts.length - 1; i >= 0; i--) {
    const g = ghosts[i];
    g.wob += dt * 3;
    if (g.booped) {
      g.spinT += dt;
      if (g.spinT >= 0.5) ghosts.splice(i, 1);
      continue;
    }
    g.x += g.vx * dt; g.y += g.vy * dt;
    // bounce off top & bottom walls; slipping out the sides = a miss
    if (g.y < 70 + g.r) { g.y = 70 + g.r; g.vy = Math.abs(g.vy); }
    if (g.y > H - g.r - 8) { g.y = H - g.r - 8; g.vy = -Math.abs(g.vy); }
    g.lit = litAmountAt(g.x, g.y);
    if (g.x < -g.r - 4 || g.x > W + g.r + 4) {
      ghosts.splice(i, 1);
      misses++;
      sfx.miss();
      floaters.push({ x: Math.max(50, Math.min(W - 50, g.x)), y: Math.max(90, g.y),
                      t: 0, text: "missed!", color: "#8a7ba8" });
      if (misses >= 3) { endGame(); return; }
    }
  }
}

// ---------- drawing ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawRoom() {
  ctx.fillStyle = "#0a0714";
  ctx.fillRect(0, 0, W, H);
  // faint spooky wallpaper dots
  ctx.fillStyle = "rgba(140,110,180,0.055)";
  let row = 0;
  for (let y = 24; y < H; y += 48, row++) {
    for (let x = 24 + (row % 2) * 24; x < W; x += 48) {
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  // baseboard
  ctx.fillStyle = "rgba(90,70,120,0.25)";
  ctx.fillRect(0, H - 26, W, 26);
  ctx.fillStyle = "rgba(140,110,180,0.18)";
  ctx.fillRect(0, H - 28, W, 2);
  drawCobweb(0, 0, 1, 1);
  drawCobweb(W, 0, -1, 1);
  drawWindow();
}
function drawCobweb(x, y, fx, fy) {
  ctx.save(); ctx.translate(x, y); ctx.scale(fx, fy);
  ctx.strokeStyle = "rgba(220,220,235,0.13)"; ctx.lineWidth = 1.5;
  for (let i = 0; i <= 3; i++) {
    const a = (Math.PI / 2) * (i / 3);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 95, Math.sin(a) * 95); ctx.stroke();
  }
  for (let r = 30; r <= 90; r += 30) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI / 2); ctx.stroke();
  }
  ctx.restore();
}
function drawWindow() {
  const ww = 120, wh = 150, wx = W - ww - 36, wy = 84;
  if (wx < W / 2) return;   // too narrow: skip
  ctx.fillStyle = "#171226";
  roundRect(wx - 8, wy - 8, ww + 16, wh + 16, 8); ctx.fill();
  ctx.fillStyle = "#232a4a";
  ctx.fillRect(wx, wy, ww, wh);
  // moon
  ctx.fillStyle = "#e8ecf5";
  ctx.beginPath(); ctx.arc(wx + ww * 0.68, wy + wh * 0.3, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#232a4a";
  ctx.beginPath(); ctx.arc(wx + ww * 0.68 - 7, wy + wh * 0.3 - 4, 16, 0, Math.PI * 2); ctx.fill();
  // cross bars
  ctx.fillStyle = "#171226";
  ctx.fillRect(wx + ww / 2 - 4, wy, 8, wh);
  ctx.fillRect(wx, wy + wh / 2 - 4, ww, 8);
  drawWindow._pos = { x: wx + ww / 2, y: wy + wh / 2 };
}
function drawMoonGlow() {
  const p = drawWindow._pos;
  if (!p) return;
  const g = ctx.createRadialGradient(p.x, p.y, 8, p.x, p.y, 190);
  g.addColorStop(0, "rgba(150,180,255,0.10)");
  g.addColorStop(1, "rgba(150,180,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(p.x - 190, p.y - 190, 380, 380);
}

function drawGhostBody(g) {
  const r = g.r;
  ctx.save();
  ctx.translate(g.x, g.y + Math.sin(g.wob) * 4);
  if (g.booped) {
    const t = Math.min(1, g.spinT / 0.5);
    ctx.rotate(t * Math.PI * 4);
    const s = Math.max(0.01, 1 - t);
    ctx.scale(s, s);
    ctx.globalAlpha = 1 - t;
  } else {
    ctx.rotate(Math.sin(g.wob * 0.7) * 0.08);
    ctx.globalAlpha = 0.06 + 0.94 * g.lit;
  }
  // sheet body: dome head + wavy hem
  ctx.fillStyle = "#f4f1ff";
  ctx.beginPath();
  ctx.moveTo(-r, r);
  ctx.lineTo(-r, -r * 0.2);
  ctx.quadraticCurveTo(-r, -r * 1.05, 0, -r * 1.05);
  ctx.quadraticCurveTo(r, -r * 1.05, r, -r * 0.2);
  ctx.lineTo(r, r);
  for (let i = 0; i < 3; i++) {
    const x0 = r - (i * 2 * r) / 3;
    ctx.quadraticCurveTo(x0 - r / 3, r + r * 0.35, x0 - (2 * r) / 3, r);
  }
  ctx.closePath(); ctx.fill();
  // cute face (only when lit enough to see it)
  if (!g.booped && g.lit > 0.25) {
    ctx.strokeStyle = "#3a3350"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.38, r * 0.16, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 0.32, -r * 0.38, r * 0.16, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -r * 0.08, r * 0.22, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
    ctx.fillStyle = "rgba(255,150,180,0.85)";
    ctx.beginPath(); ctx.arc(-r * 0.56, -r * 0.12, r * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.56, -r * 0.12, r * 0.12, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawGhostEyes(g) {
  // faint glowing eyes in the dark, bright in the beam
  if (g.booped) return;
  const r = g.r;
  ctx.save();
  ctx.globalAlpha = 0.22 + 0.78 * g.lit;
  ctx.translate(g.x, g.y + Math.sin(g.wob) * 4);
  ctx.fillStyle = "#cfe8ff";
  ctx.shadowColor = "#9fd0ff"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.38, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.32, -r * 0.38, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawMiniGhost(x, y, lost) {
  ctx.save(); ctx.translate(x, y); ctx.scale(0.34, 0.34);
  ctx.fillStyle = lost ? "#4a4558" : "#f4f1ff";
  ctx.beginPath();
  ctx.moveTo(-26, 26); ctx.lineTo(-26, -6);
  ctx.quadraticCurveTo(-26, -28, 0, -28);
  ctx.quadraticCurveTo(26, -28, 26, -6);
  ctx.lineTo(26, 26); ctx.closePath(); ctx.fill();
  if (lost) {
    ctx.strokeStyle = "#2a2733"; ctx.lineWidth = 5; ctx.lineCap = "round";
    for (const ex of [-9, 9]) {
      ctx.beginPath();
      ctx.moveTo(ex - 4, -12); ctx.lineTo(ex + 4, -4);
      ctx.moveTo(ex + 4, -12); ctx.lineTo(ex - 4, -4);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = "#3a3350";
    ctx.beginPath(); ctx.arc(-9, -8, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -8, 3.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawDarkness() {
  // near-black room with a soft hole where the beam shines
  const r = BEAM_R * beam.flick;
  const diag = Math.hypot(W, H);
  const g = ctx.createRadialGradient(beam.x, beam.y, r * 0.5, beam.x, beam.y, diag);
  g.addColorStop(0, "rgba(4,2,10,0)");
  g.addColorStop(Math.min(0.999, (r - r * 0.5) / (diag - r * 0.5)), "rgba(4,2,10,0.93)");
  g.addColorStop(1, "rgba(4,2,10,0.96)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // warm tint inside the beam
  const w = ctx.createRadialGradient(beam.x, beam.y, 10, beam.x, beam.y, r);
  w.addColorStop(0, "rgba(255,220,150,0.10)");
  w.addColorStop(1, "rgba(255,220,150,0)");
  ctx.fillStyle = w;
  ctx.fillRect(beam.x - r, beam.y - r, r * 2, r * 2);
}

function drawMotes() {
  for (const m of motes) {
    const a = 0.5 * litAmountAt(m.x, m.y) * (0.6 + 0.4 * Math.sin(m.tw));
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = "#fff3d6";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFloaters() {
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, 1 - f.t / 0.9);
    ctx.fillStyle = f.color || "#ffd23e";
    ctx.font = "800 22px -apple-system, sans-serif";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

function drawBackButton() {
  const w = 122, h = 38, x = 12, y = 12;
  backBtn = { x, y, w, h };
  ctx.fillStyle = "rgba(255,255,255,0.10)";
  roundRect(x, y, w, h, 19); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2;
  roundRect(x, y, w, h, 19); ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.font = "700 17px -apple-system, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("‹ Arcade", x + w / 2, y + h / 2 + 1);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}
function hitBackButton(e) {
  if (!backBtn) return false;
  const x = e.clientX || 0, y = e.clientY || 0;
  return x >= backBtn.x && x <= backBtn.x + backBtn.w && y >= backBtn.y && y <= backBtn.y + backBtn.h;
}

function drawHUD() {
  // misses: 3 little ghost icons under the back button
  for (let i = 0; i < 3; i++) drawMiniGhost(34 + i * 44, 82, i < misses);
  // score top-right
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.font = "700 15px -apple-system, sans-serif";
  ctx.fillText("SCORE", W - 16, 24);
  ctx.fillStyle = "#ffd23e";
  ctx.font = "800 32px -apple-system, sans-serif";
  ctx.fillText(String(score), W - 16, 56);
  ctx.textAlign = "left";
}

function drawPanel(title, lines, accent, titleSize) {
  const w = Math.min(W - 60, 440), h = 120 + lines.length * 30;
  const x = W / 2 - w / 2, y = H / 2 - h / 2;
  ctx.fillStyle = "rgba(14,8,26,0.88)";
  roundRect(x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = accent; ctx.lineWidth = 4;
  roundRect(x, y, w, h, 22); ctx.stroke();
  ctx.textAlign = "center";
  ctx.fillStyle = accent; ctx.font = "900 " + (titleSize || 40) + "px -apple-system, sans-serif";
  ctx.fillText(title, W / 2, y + 62);
  ctx.fillStyle = "#ffffff"; ctx.font = "700 19px -apple-system, sans-serif";
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + 108 + i * 30));
  ctx.textAlign = "left";
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawRoom();
  for (const g of ghosts) drawGhostBody(g);
  drawDarkness();
  drawMoonGlow();
  for (const g of ghosts) drawGhostEyes(g);
  drawMotes();
  drawParticles();
  drawFloaters();
  drawBackButton();
  if (state === STATE.PLAYING) drawHUD();
  if (state === STATE.TITLE) {
    drawPanel("FLASHLIGHT GHOST HUNT!", [
      "Shine your light to find the ghosts,",
      "then tap a lit ghost to boop it!",
      best > 0 ? ("Best: " + best + " boops") : "Move with mouse, touch, or arrow keys"
    ], "#b48cff", 30);
  } else if (state === STATE.OVER) {
    drawHUD();
    drawPanel("GAME OVER", [
      "Score: " + score + (newBest ? "  —  NEW BEST!" : ""),
      "Best: " + best,
      "Tap or press Space to play again"
    ], "#ff8fb3", 40);
  }
  ctx.restore();
}

// ---------- main loop ----------
function frame(now) {
  update(now);
  draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
